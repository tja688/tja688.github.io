<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>空白格位 · 小游档案</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      @font-face {
        font-family: Silkscreen;
        src: url("/fonts/Silkscreen-Regular.ttf");
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 28px;
        background: #111310;
        color: #e8e8e3;
        font:
          15px/1.8 system-ui,
          "Microsoft YaHei",
          sans-serif;
      }
      main {
        max-width: 540px;
      }
      .code {
        font:
          68px Silkscreen,
          monospace;
        color: #c4ed8b;
      }
      h1 {
        font-size: 30px;
      }
      p {
        color: #a3a6a0;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 22px;
        background: #c4ed8b;
        color: #182014;
        text-decoration: none;
        box-shadow: 3px 3px #4b5b36;
      }
      a:focus-visible {
        outline: 2px solid white;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>这一格是空的。</h1>
      <p>你找的游戏档案不在这里。回到起点，换个小世界看看。</p>
      <a href="/">← 返回作品库</a>
    </main>
  </body>
</html>
