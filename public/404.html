<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 · TJA688</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #18171b;
        --ink: #ece7dd;
        --muted: #a09b92;
        --faint: #6f6b65;
        --accent: #4a63ff;
        --line: rgba(236, 231, 221, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: 'Archivo', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(100%, 36rem);
      }
      .eyebrow {
        margin: 0 0 1.25rem;
        font-family: ui-monospace, 'IBM Plex Mono', Menlo, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--faint);
      }
      h1 {
        margin: 0;
        font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
        font-weight: 700;
        font-size: clamp(3rem, 12vw, 6.5rem);
        line-height: 0.95;
        letter-spacing: -0.02em;
      }
      p {
        margin: 1.25rem 0 0;
        max-width: 28rem;
        font-size: 1rem;
        line-height: 1.7;
        color: var(--muted);
      }
      .rule {
        margin: 2rem 0;
        height: 1px;
        background: var(--line);
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--ink);
        text-decoration: none;
        font-size: 0.9rem;
        border-bottom: 1px solid var(--line);
        padding-bottom: 2px;
        transition: border-color 0.2s;
      }
      a:hover {
        border-color: var(--accent);
      }
      a span {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404 · not found</p>
      <h1>这一格是空的</h1>
      <p>你找的页面不在这里。可能链接已经变了，也可能它从来就没存在过。</p>
      <div class="rule"></div>
      <a href="/"><span>←</span> 回到首页</a>
    </main>
  </body>
</html>
