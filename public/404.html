<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #060b16;
        --text: #f3f8ff;
        --muted: rgba(243, 248, 255, 0.7);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>页面不存在。</p>
      <a href="/">返回首页</a>
    </main>
  </body>
</html>
