<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 // Signal Lost</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #060b16;
        --panel: rgba(10, 17, 30, 0.84);
        --line: rgba(137, 232, 255, 0.2);
        --accent: #7df0ff;
        --text: #eef7ff;
        --muted: rgba(238, 247, 255, 0.68);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Manrope", system-ui, sans-serif;
        background:
          radial-gradient(circle at 20% 20%, rgba(125, 240, 255, 0.18), transparent 28%),
          radial-gradient(circle at 80% 12%, rgba(255, 87, 176, 0.12), transparent 22%),
          linear-gradient(180deg, #03050d 0%, var(--bg) 100%);
        color: var(--text);
      }
      .panel {
        width: min(560px, 100%);
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
      }
      .eyebrow {
        margin: 0 0 12px;
        letter-spacing: 0.18em;
        font-size: 0.82rem;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 0;
        font-family: "Teko", sans-serif;
        font-size: clamp(3rem, 10vw, 5.8rem);
        line-height: 0.9;
      }
      p {
        color: var(--muted);
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        margin-top: 12px;
        padding: 0 18px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--text);
        text-decoration: none;
        background: rgba(125, 240, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <p class="eyebrow">Signal Lost</p>
      <h1>404</h1>
      <p>你访问的页面不在当前场景树中。返回主页重新进入作品区。</p>
      <a href="/">Return Home</a>
    </main>
  </body>
</html>
