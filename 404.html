<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(180deg, #f7f1e6 0%, #efe7db 100%);
        font-family: "Segoe UI", sans-serif;
        color: #1f1d1a;
      }

      main {
        max-width: 520px;
        padding: 28px;
        border: 1px solid rgba(31, 29, 26, 0.12);
        border-radius: 24px;
        background: rgba(255, 250, 242, 0.88);
        text-align: center;
      }

      a {
        color: #7d2b17;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>这个页面暂时不存在。</h1>
      <p>如果你是从旧链接跳过来的，可以先回到主页继续浏览。</p>
      <p><a href="./">返回首页</a></p>
    </main>
  </body>
</html>
